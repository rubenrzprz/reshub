name: reshub

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reshub}
      POSTGRES_USER: ${POSTGRES_USER:-reshub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reshub}
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reshub} -d ${POSTGRES_DB:-reshub}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db-data:/var/lib/postgresql/data
  api:
    build: .
    container_name: reshub_api
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      POSTGRES_DB: ${POSTGRES_DB:-reshub}
      POSTGRES_USER: ${POSTGRES_USER:-reshub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reshub}
      DB_PORT: ${DB_PORT:-5432}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
volumes:
  db-data:
