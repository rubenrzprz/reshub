spring:
  datasource:
    url: jdbc:postgresql://db:5432/${POSTGRES_DB:reshub}
    username: ${POSTGRES_USER:reshub}
    password: ${POSTGRES_PASSWORD:reshub}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/dev
